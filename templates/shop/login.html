{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Butterfly Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="theme-color" content="#1e1b4b">
    <link rel="manifest" href="{% static 'shop/manifest.json' %}">
    <link rel="apple-touch-icon" href="{% static 'shop/icons/icon-192.png' %}">
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center px-4">

    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <div class="w-16 h-16 rounded-full bg-indigo-50 flex items-center justify-center text-3xl mx-auto mb-4">&#129419;</div>
            <h1 class="text-2xl font-bold text-white">Butterfly Shop</h1>
            <p class="text-slate-400 text-sm mt-1">Order &amp; billing manager</p>
        </div>

        <form method="post" class="bg-white rounded-2xl shadow-xl p-6 space-y-4">
            {% csrf_token %}
            {% if form.non_field_errors %}
            <div class="px-4 py-3 rounded-lg bg-red-50 text-red-700 text-sm border border-red-200">
                Invalid username or password.
            </div>
            {% endif %}

            <div>
                <label for="id_username" class="block text-sm font-medium text-slate-700 mb-1">Username</label>
                <input type="text" name="username" id="id_username" autocomplete="username" required
                       class="w-full text-lg px-4 py-3 rounded-xl border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none">
            </div>

            <div>
                <label for="id_password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <input type="password" name="password" id="id_password" autocomplete="current-password" required
                       class="w-full text-lg px-4 py-3 rounded-xl border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none">
            </div>

            <button type="submit"
                    class="w-full text-lg font-bold text-white bg-slate-900 hover:bg-indigo-600 px-4 py-3.5 rounded-xl transition-colors">
                Sign in
            </button>
        </form>

        <p class="text-center text-slate-500 text-xs mt-6">&copy; Butterfly Designer</p>
    </div>

</body>
</html>

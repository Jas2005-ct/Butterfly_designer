{% extends "shop/base_shop.html" %}

{% block title %}New Customer — Butterfly Shop{% endblock %}

{% block content %}
<div class="mb-4">
    <h1 class="text-2xl font-bold">New Customer</h1>
    <p class="text-slate-500 text-sm">Add a customer to the system.</p>
</div>

<form method="post" class="bg-white rounded-2xl border border-slate-200 p-5 sm:p-6 space-y-5 max-w-xl lg:max-w-3xl">
    {% csrf_token %}

    <div>
        <label for="name" class="block text-sm font-medium text-slate-700 mb-1">Name *</label>
        <input type="text" name="name" id="name" required
               class="w-full text-lg px-4 py-3 rounded-xl border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none">
    </div>

    <div>
        <label for="phone" class="block text-sm font-medium text-slate-700 mb-1">Phone *</label>
        <input type="tel" name="phone" id="phone" required
               class="w-full text-lg px-4 py-3 rounded-xl border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none">
    </div>

    <div>
        <label for="notes" class="block text-sm font-medium text-slate-700 mb-1">Notes</label>
        <textarea name="notes" id="notes" rows="3"
                  class="w-full text-lg px-4 py-3 rounded-xl border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none"></textarea>
    </div>

    {% include "shop/customers/_measurement_fields.html" %}

    <div class="flex gap-3 pt-2">
        <button type="submit"
                class="flex-1 bg-slate-900 text-white font-bold px-4 py-3.5 rounded-xl hover:bg-indigo-600 transition-colors">
            Create Customer
        </button>
        <a href="{% url 'customers:list' %}"
           class="px-6 py-3.5 rounded-xl font-medium border border-slate-300 text-slate-600 hover:bg-slate-100">
            Cancel
        </a>
    </div>
</form>
{% endblock %}

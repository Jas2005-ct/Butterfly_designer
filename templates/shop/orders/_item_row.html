{# One line of the item editor. `item` is an OrderItem, or None for a #}
{# blank row - every field below falls back cleanly when it is None. #}
{# #}
{# The five names repeat on purpose: the view reads them back with #}
{# getlist() and zips the rows together again. #}

<tr class="item-row align-top">
    <td class="py-1 pr-2">
        <input type="hidden" name="item_id" value="{{ item.id|default:'' }}">
        <input type="text" name="item_description" value="{{ item.description|default:'' }}"
               placeholder="Blouse with lining"
               class="w-full px-2 py-2 rounded-lg border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none">
    </td>
    <td class="py-1 pr-2">
        <input type="number" name="item_quantity" min="1" step="1" value="{{ item.quantity|default:1 }}"
               class="w-full px-2 py-2 rounded-lg border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none">
    </td>
    <td class="py-1 pr-2">
        <input type="number" name="item_price" min="0" step="0.01" value="{{ item.price|default:'' }}"
               placeholder="—"
               class="w-full px-2 py-2 rounded-lg border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none">
    </td>
    <td class="py-1 pr-2">
        <select name="item_material"
                class="w-full px-2 py-2 rounded-lg border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none">
            {% for value, label in material_choices %}
            <option value="{{ value }}" {% if item.material_source == value %}selected{% endif %}>
                {{ label }}
            </option>
            {% endfor %}
        </select>
    </td>
    <td class="py-1 text-center">
        <button type="button" class="remove-item text-xl leading-none text-slate-400 hover:text-red-600"
                aria-label="Remove this item">&times;</button>
    </td>
</tr>

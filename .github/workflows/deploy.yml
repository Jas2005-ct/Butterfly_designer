name: Deploy to ECS Express Mode

# Updates the running Express Mode service to an image in ECR.
#
# NOTE: the container environment variables (DATABASE_URL, DJANGO_SECRET_KEY,
# S3 credentials, ...) are configured on the service itself and are
# deliberately NOT set here, so a redeploy cannot overwrite them.
#
# The task SIZE (cpu/memory) IS set here, because it is part of the release
# decision. Defaults are 512 vCPU-units / 1024 MiB: measured production usage
# is ~63 MB memory and 0.3% CPU average, so 1 vCPU / 2 GB was ~30x oversized
# and cost ~$18/month more than needed. See docs/flow.md Part 6.
#
# ORDER OF OPERATIONS: migrations run as a one-off task BEFORE the service is
# updated, so a migration failure stops the release rather than shipping code
# against a stale schema. Migrations must therefore stay backwards compatible
# (additive only) - the previous containers keep serving during the gap.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy - use the commit SHA of the release, e.g. a7c2941aa02d295d3a1751eec3594e4c33824968. Not 'latest': that tag moves with every merge."
        required: true
      migrate:
        description: "Run database migrations as a one-off task before updating the service. Keep 'true' for a normal release; set 'false' only when rolling back to an older image whose migrations are already applied."
        required: false
        default: "true"
      cpu:
        description: "Task vCPU units - 256 / 512 / 1024 / 2048. Default 512 (0.5 vCPU); measured peak CPU is 25%."
        required: false
        default: "512"
      memory:
        description: "Task memory in MiB - 512 / 1024 / 2048. Default 1024 (1 GB); measured peak is ~63 MB."
        required: false
        default: "1024"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ACCOUNT_ID: "558948635923"
  ECR_REPOSITORY: butterfly-designer
  SERVICE_NAME: butterfly-designer

jobs:
  deploy:
    name: Update the Express service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refuse a moving tag
        run: |
          if [ "${{ inputs.image_tag }}" = "latest" ]; then
            echo "::error::Refusing to deploy the moving 'latest' tag. Pass the commit SHA of the release you intend to ship - it is the only tag that identifies one specific build."
            exit 1
          fi

      - name: Validate the task size
        env:
          DEPLOY_CPU: ${{ inputs.cpu }}
          DEPLOY_MEMORY: ${{ inputs.memory }}
        run: |
          # Fail fast with a readable message instead of a cryptic ECS API
          # error if someone types a size Fargate does not offer.
          case " ${DEPLOY_CPU} " in
            *" 256 "*|*" 512 "*|*" 1024 "*|*" 2048 "*) ;;
            *)
              echo "::error::cpu must be one of 256 / 512 / 1024 / 2048 (got '${DEPLOY_CPU}')"
              exit 1
              ;;
          esac
          case " ${DEPLOY_MEMORY} " in
            *" 512 "*|*" 1024 "*|*" 2048 "*) ;;
            *)
              echo "::error::memory must be one of 512 / 1024 / 2048 (got '${DEPLOY_MEMORY}')"
              exit 1
              ;;
          esac
          echo "Task size: ${DEPLOY_CPU} vCPU-units / ${DEPLOY_MEMORY} MiB"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Run migrations (one-off task)
        # Runs BEFORE the service update on purpose: if migrations fail, the
        # release must stop here instead of shipping code against a stale
        # schema. entrypoint.sh passes the command through to manage.py, so
        # the task runs migrations and exits instead of booting gunicorn.
        env:
          DEPLOY_MIGRATE: ${{ inputs.migrate }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          if [ "$DEPLOY_MIGRATE" != "true" ]; then
            echo "Skipping migrations (migrate='${DEPLOY_MIGRATE}') - keep 'true' for a normal release."
            exit 0
          fi

          CLUSTER="default"
          FAMILY="default-butterfly-designer"
          CONTAINER="Main"
          IMAGE="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}"

          # Fargate awsvpc tasks in this VPC have no NAT gateway, so they need
          # a public IP to reach the Supabase Postgres pooler on :6543. These
          # are the same three public subnets and task security group the
          # service uses - see docs/aws-setup.md sections 4 and 5.
          NETWORK="awsvpcConfiguration={subnets=[subnet-0c3224681fe6f4964,subnet-0dcb582aab2b0200f,subnet-00c09a8f2fdfdf3ed],securityGroups=[sg-0d7b2baa46c4620bb],assignPublicIp=ENABLED}"

          # The image is overridden so migrations come from the release being
          # deployed; DATABASE_URL and the rest of the environment are inherited
          # from the existing task definition (never set in this file).
          OVERRIDES=$(printf '{"containerOverrides":[{"name":"%s","image":"%s","command":["migrate","--noinput"]}]}' "$CONTAINER" "$IMAGE")

          echo "Applying migrations with ${IMAGE} ..."
          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$FAMILY" \
            --launch-type FARGATE \
            --network-configuration "$NETWORK" \
            --overrides "$OVERRIDES" \
            --query 'tasks[0].taskArn' \
            --output text)

          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "::error::ecs run-task returned no task; migrations did not run."
            exit 1
          fi
          echo "Migration task: ${TASK_ARN}"

          # Polls every 6s for up to 10 minutes; set -e turns a timeout into a
          # failed step rather than a migration that silently never finished.
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          STOP_REASON=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].stoppedReason' --output text)
          echo "migration exit code: ${EXIT_CODE} (${STOP_REASON})"

          if [ "$EXIT_CODE" = "0" ]; then
            echo "Migrations are up to date."
            exit 0
          fi

          echo "::error::Migrations FAILED (exit ${EXIT_CODE}). The service was NOT updated."
          # The Django traceback only exists in the container log - stoppedReason
          # never carries it - so print the task's own log stream here.
          LOG_GROUP=$(aws ecs describe-task-definition --task-definition "$FAMILY" \
            --query 'taskDefinition.containerDefinitions[0].logConfiguration.options.awslogs-group' --output text)
          STREAM_PREFIX=$(aws ecs describe-task-definition --task-definition "$FAMILY" \
            --query 'taskDefinition.containerDefinitions[0].logConfiguration.options.awslogs-stream-prefix' --output text)
          aws logs get-log-events \
            --log-group-name "$LOG_GROUP" \
            --log-stream-name "${STREAM_PREFIX}/${CONTAINER}/${TASK_ARN##*/}" \
            --start-from-head \
            --query 'events[].message' \
            --output text 2>/dev/null | tail -c 8000 || echo "(container log not readable yet)"
          exit 1

      - name: Deploy Express service
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          service-name: ${{ env.SERVICE_NAME }}
          image: ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ inputs.image_tag }}
          execution-role-arn: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/ecsTaskExecutionRole
          infrastructure-role-arn: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/ecsInfrastructureRoleForExpressServices
          container-port: 8000
          health-check-path: /healthz
          cpu: ${{ inputs.cpu }}
          memory: ${{ inputs.memory }}

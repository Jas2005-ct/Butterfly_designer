name: Build and push image

# Builds the Docker image and pushes it to ECR. The Express Mode service
# deploys an image, so this workflow is the "source" half of the pipeline
# (App Runner used to do this itself, but it is closed to new customers).

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write # required for OIDC -> no long-lived AWS keys in GitHub
  contents: read

env:
  AWS_REGION: ap-south-1
  ACCOUNT_ID: "558948635923"
  ECR_REPOSITORY: butterfly-designer

jobs:
  build:
    name: Build and push to ECR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        uses: aws-actions/amazon-ecr-build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest
            ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
